<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교과별 AI 디지털 수업 실천과정 · 강의안</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ee;--ink:#2a2620;--mute:#6b6559;--ocher:#b4781f;--teal:#1f7a78;--line:#e0d8c6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:1fr minmax(0,340px);background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;word-break:keep-all}
main{padding:clamp(28px,6vw,72px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.eyebrow{display:flex;align-items:center;gap:14px;font-weight:700;color:var(--ocher);letter-spacing:.04em}
.eyebrow:before{content:"";width:40px;height:3px;background:var(--ocher)}
h1{margin:0;font-family:'Gowun Batang',serif;font-size:clamp(32px,4.4vw,50px);line-height:1.25}
.sub{margin:0;color:var(--mute);font-size:clamp(17px,2vw,22px);line-height:1.6}
.row{display:flex;gap:16px;align-items:center;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:#fffdf8;font-size:18px}
.row b{width:56px;color:var(--mute)}
.row.a{background:#f8efd9;border-color:#e3cd9b}.row.a b{color:var(--ocher)}
.row.b{background:#e1f1ef;border-color:#a9d3cf}.row.b b{color:var(--teal)}
form{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
input{flex:1 1 180px;min-width:0;font:inherit;font-size:20px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;letter-spacing:.1em}
input:focus{outline:none;border-color:var(--teal)}
button{font:inherit;font-weight:700;font-size:18px;padding:12px 26px;border:0;border-radius:12px;background:var(--teal);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.5em;margin:0;color:#a8432c;font-size:16px}
.rows{display:flex;flex-direction:column;gap:10px}
a.row{color:inherit;text-decoration:none}
a.row[href]{cursor:pointer;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.06)}
a.row[href]:after{content:"→";margin-left:auto;font-size:22px}
a.row[href]:hover{transform:translateY(-1px);filter:brightness(.97)}
aside{background:#e1f1ef;position:relative;overflow:hidden}
aside svg{position:absolute;inset:0;width:100%;height:100%}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.side{display:flex;align-items:flex-start;gap:14px}
.box{background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box .t{display:inline-block;font-size:14px;font-weight:700;padding:2px 9px;border-radius:99px;background:#f8efd9;color:var(--ocher);margin-bottom:8px}
.box.q .t{background:#e1f1ef;color:var(--teal)}
.joinurl{display:block;font-family:inherit;font-size:21px;font-weight:700;color:var(--teal);word-break:keep-all;white-space:nowrap;line-height:1.5}
.box.j{max-width:230px}
.box.j .d{margin:8px 0 0;font-size:14px;color:var(--mute);line-height:1.5}
.box.q .qrlink{display:block;width:fit-content;cursor:pointer}.box.q img{display:block;width:140px;margin:0 auto;height:auto;border-radius:6px}
.box.q .qlink{display:block;font-size:19px;font-weight:700;color:var(--teal);text-decoration:none;line-height:1.5;margin-top:2px}.box.q .qlink:hover{text-decoration:underline}
.box.q .d{margin:8px 0 0;font-size:12.5px;color:#4a463e;line-height:1.5;width:190px;word-break:keep-all}.box.q .d b{color:#a8432c}
@media(max-width:820px){body{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<main>
<div class="eyebrow"><span id="eb">수학과 · 교사 연수</span></div>
<div class="head"><h1>교과별 AI 디지털<br>수업 실천과정</h1>
<div class="side"><div class="box j"><span class="t">연수 참여 링크</span><code class="joinurl">숏.한국/<br>세일고AI-수학/</code><p class="d">선생님 접속용</p></div>
<div class="box q"><span class="t">사후 설문조사</span><a class="qlink" href="https://walla.my/a/2015d7ff-00b9-45d0-b673-cafd868e432b" target="_blank" rel="noopener">사후 설문조사 열기 ↗</a></div></div></div>
<p class="sub">수학 수업과 평가에 AI를 붙여 보는 세 번의 연수입니다.</p>
<div class="rows">
<a class="row a" id="r0"><b>1차시</b>Gemini로 수업 만들기</a>
<a class="row b" id="r1"><b>2차시</b>스노클로 풀이 과정 보고 피드백하기</a>
<a class="row" id="r2"><b>3차시</b>클리포로 서·논술형 채점하고 세특 쓰기</a>
</div>
<div id="gate">
<form id="f"><input id="code" type="password" inputmode="text" autocomplete="off" placeholder="접속 코드" aria-label="접속 코드" required><button id="go">입장</button></form>
<p id="msg" role="status"></p>
</div>
</main>
<aside>
<svg aria-hidden="true" viewBox="0 0 420 720" preserveAspectRatio="xMidYMid slice" fill="none">
<g stroke="#1f7a78" stroke-opacity=".18"><path d="M0 120H420M0 240H420M0 360H420M0 480H420M0 600H420M70 0V720M175 0V720M280 0V720M385 0V720"/></g>
<path d="M0 360H420M210 0V720" stroke="#1f7a78" stroke-opacity=".45" stroke-width="2"/>
<path d="M50 90Q210 750 370 90" stroke="#1f7a78" stroke-width="5" stroke-linecap="round"/>
<path d="M20 520H400" stroke="#b4781f" stroke-width="4" stroke-linecap="round"/>
<circle cx="210" cy="520" r="11" fill="#faf6ee" stroke="#b4781f" stroke-width="4"/>
</svg>
</aside>
<script>
// 앱스크립트 배포 후 나온 웹 앱 주소(…/exec)를 아래에 붙여 넣으세요.
var API = 'https://script.google.com/macros/s/AKfycbw6Nq6KYybKtnABFFqyVhE4ER6A-SAmQJBx2FBmz8jNeeeHyaWRAXvAoFOsbld6k9RwyQ/exec';
var KEY = 'lecture_ok';
var f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
function show(links){
  links.forEach(function(l,i){var a=document.getElementById('r'+i);if(a)a.href=l.url});
  document.getElementById('gate').style.display='none';
}
if(/[?&]teacher\b/.test(location.search)){
  ['/lecture/','/lecture2/','/lecture3/'].forEach(function(u,i){document.getElementById('r'+i).href=u+'?teacher'});
  document.getElementById('gate').style.display='none';
  document.getElementById('eb').textContent='강의자용 · 쪽을 넘기면 선생님 화면이 따라옵니다';
  document.title='[강의자] '+document.title;
}else{
try{var saved=sessionStorage.getItem(KEY);if(saved)show(JSON.parse(saved))}catch(e){}
}
f.addEventListener('submit', function(e){
  e.preventDefault();
  msg.textContent = ''; go.disabled = true; go.textContent = '확인 중…';
  fetch(API + '?code=' + encodeURIComponent(document.getElementById('code').value.trim()))
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.ok){try{sessionStorage.setItem(KEY,JSON.stringify(d.links))}catch(e){} show(d.links)}
      else{msg.textContent='코드가 맞지 않습니다. 다시 확인해 주세요.'}
    })
    .catch(function(){msg.textContent='확인하지 못했습니다. 잠시 뒤 다시 시도해 주세요.'})
    .then(function(){go.disabled=false;go.textContent='입장'});
});
</script>
</body>
</html>
